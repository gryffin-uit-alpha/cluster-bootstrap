# Default values for myblogspot.
# Ref: Knowledge_Base/Kubernetes.md & ArgoCD-CI.md

environment: staging

# ==========================================
# Backend Service Configuration (Golang Chi)
# ==========================================
backend:
  replicaCount: 2
  image:
    repository: ghcr.io/gryffin-uit-alpha/myblogspot-backend
    pullPolicy: IfNotPresent
    tag: "latest" # Overridden by CI/CD GitOps

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Pod Security Standard: Restricted
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # In-memory writable mounts for readOnlyRootFilesystem compliance
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp
    - name: uploads
      mountPath: /app/uploads

  extraVolumes:
    - name: tmp
      emptyDir: {}
    - name: uploads
      emptyDir: {}

  probes:
    liveness:
      path: /livez
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      path: /readyz
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 2

  env:
    PORT: "8080"
    ENVIRONMENT: "staging"
    LOG_LEVEL: "info"
    RATE_LIMIT_RPS: "50"
    RATE_LIMIT_BURST: "100"

  # Secrets loaded from Kubernetes Secret or AWS SSM via ExternalSecrets
  secretName: "myblogspot-backend-secrets"
  secrets:
    DB_URL: "postgresql://postgres:postgres@myblogspot-postgres:5432/myblogspot_dev?sslmode=disable"
    REDIS_URL: "redis://myblogspot-redis:6379"
    JWT_SECRET: "change-me-in-production-vault"

# ==========================================
# Frontend Service Configuration (Next.js 14)
# ==========================================
frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/gryffin-uit-alpha/myblogspot-frontend
    pullPolicy: IfNotPresent
    tag: "latest" # Overridden by CI/CD GitOps

  service:
    type: ClusterIP
    port: 80
    targetPort: 3000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false # Next.js standalone writes cache/server
    capabilities:
      drop:
        - ALL

  probes:
    liveness:
      path: /
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 2

  env:
    PORT: "3000"
    NODE_ENV: "production"
    NEXT_PUBLIC_API_URL: "https://gryffin-uit.site/api/v1"
    INTERNAL_API_URL: "http://myblogspot-backend:8080/api/v1"

# ==========================================
# Ingress Routing & TLS
# ==========================================
ingress:
  enabled: true
  className: "traefik" # or "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: gryffin-uit.site
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /livez
          pathType: Exact
          service: backend
        - path: /readyz
          pathType: Exact
          service: backend
        - path: /metrics
          pathType: Exact
          service: backend
        - path: /uploads
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls:
    - secretName: myblogspot-tls-cert
      hosts:
        - gryffin-uit.site

# ==========================================
# Zero-Trust Network Policy
# ==========================================
networkPolicy:
  enabled: true

# ==========================================
# Prometheus Metrics Scraping
# ==========================================
serviceMonitor:
  enabled: false
  interval: 15s
