apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.backend.secretName }}
  labels:
    {{- include "myblogspot.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_URL: {{ .Values.backend.secrets.DB_URL | quote }}
  REDIS_URL: {{ .Values.backend.secrets.REDIS_URL | quote }}
  JWT_SECRET: {{ .Values.backend.secrets.JWT_SECRET | quote }}
