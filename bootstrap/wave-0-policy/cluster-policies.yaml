# ==============================================================================
# KYVERNO CLUSTER POLICIES
# Ref: Knowledge_Base/Security.md (Phần 5: Admission Control — Kyverno)
# Best Practice: validationFailureAction = Audit for staging, exclude system namespaces
# ==============================================================================

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-user
  annotations:
    policies.kyverno.io/title: Disallow Root User
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Chạy container với user root (UID 0) là rủi ro bảo mật nghiêm trọng.
      Policy này yêu cầu container phải cấu hình runAsNonRoot: true.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
                - argocd
                - monitoring
      validate:
        message: "Container không được chạy dưới quyền root. Cần khai báo securityContext.runAsNonRoot: true."
        pattern:
          spec:
            =(securityContext):
              =(runAsNonRoot): true
            containers:
              - name: "*"
                =(securityContext):
                  =(runAsNonRoot): true
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/category: Best Practices / Capacity Management
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Mọi container phải khai báo requests và limits về CPU/Memory để tránh hiện tượng
      Noisy Neighbor làm cạn kiệt tài nguyên node.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-container-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
                - argocd
                - monitoring
      validate:
        message: "Mọi container phải có resources.requests và resources.limits (cpu & memory)."
        pattern:
          spec:
            containers:
              - name: "*"
                resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Best Practices / Immutability
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Không sử dụng tag 'latest' trong image URL để đảm bảo tính bất biến (immutability)
      và khả năng rollback chính xác trong GitOps.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: validate-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
                - argocd
                - monitoring
      validate:
        message: "Không được sử dụng image tag ':latest'. Hãy dùng semantic version hoặc commit SHA."
        pattern:
          spec:
            containers:
              - name: "*"
                image: "!*:latest"
