# ==============================================================================
# KARPENTER v1.0 EC2NodeClass & NodePool (Spot + On-Demand Consolidation)
# ==============================================================================
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: "staging-myblogspot-eks-node-role"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "staging-myblogspot-eks"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "staging-myblogspot-eks"
  tags:
    Project: "MyBlogSpot"
    Environment: "staging"
    ManagedBy: "Karpenter"
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        intent: apps
        provisioner: karpenter
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.small", "t3.medium", "t3a.small", "t3a.medium", "c6i.large"]
  limits:
    cpu: 16
    memory: 32Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
