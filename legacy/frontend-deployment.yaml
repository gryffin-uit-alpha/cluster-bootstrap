apiVersion: apps/v1
kind: Deployment
metadata:
  name: myblogspot-frontend
  labels:
    app.kubernetes.io/name: myblogspot-frontend
    app.kubernetes.io/part-of: myblogspot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: myblogspot-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: myblogspot-frontend
        app.kubernetes.io/part-of: myblogspot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: frontend
          image: ghcr.io/gryffin-uit-alpha/myblogspot-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: NEXT_PUBLIC_API_URL
              value: "https://gryffin-uit.site"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
