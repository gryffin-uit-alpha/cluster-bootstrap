apiVersion: v1
kind: Service
metadata:
  name: myblogspot-backend
  labels:
    app.kubernetes.io/name: myblogspot-backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: myblogspot-backend
---
apiVersion: v1
kind: Service
metadata:
  name: myblogspot-frontend
  labels:
    app.kubernetes.io/name: myblogspot-frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/name: myblogspot-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myblogspot-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
    - host: gryffin-uit.site
      http:
        paths:
          # Backend API & Health routing
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: myblogspot-backend
                port:
                  number: 8080
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: myblogspot-backend
                port:
                  number: 8080
          - path: /livez
            pathType: Exact
            backend:
              service:
                name: myblogspot-backend
                port:
                  number: 8080
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: myblogspot-backend
                port:
                  number: 8080
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: myblogspot-backend
                port:
                  number: 8080
          # Frontend static routing (default root)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: myblogspot-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - gryffin-uit.site
      secretName: myblogspot-tls-cert
---
# NetworkPolicy: Zero-Trust Pod Micro-segmentation
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: myblogspot-network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: myblogspot
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Cho phép Ingress Controller kết nối
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
  egress:
    # Cho phép kết nối Database PostgreSQL (Port 5432)
    - ports:
        - protocol: TCP
          port: 5432
    # Cho phép truy vấn DNS trong cluster (CoreDNS port 53)
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# ServiceMonitor: Tích hợp Prometheus Operator
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: myblogspot-backend-monitor
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: myblogspot-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
