# ==============================================================================
# SYNC WAVE -1: EXTERNAL SECRETS OPERATOR (ESO)
# Ref: Knowledge_Base/DevSecOps.md & Cloud.md Phần 5 (IRSA)
# Fetches secrets from AWS Secrets Manager natively without plaintext in Git
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wave--1-external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.9.18
    helm:
      values: |
        installCRDs: true
        serviceAccount:
          create: true
          name: external-secrets
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::736052310305:role/staging-myblogspot-eso-role
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
