# ==============================================================================
# SYNC WAVE 2: MYBLOGSPOT APPLICATION (STAGING)
# Repo: CD Config Repository (myblogspot-cd)
# Environment: Staging
# Namespace: staging
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myblogspot-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/gryffin-uit-alpha/myblogspot-cd.git
    targetRevision: HEAD
    path: helm/myblogspot
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
