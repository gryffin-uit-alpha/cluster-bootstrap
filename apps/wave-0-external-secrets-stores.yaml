# ==============================================================================
# SYNC WAVE 0: EXTERNAL SECRETS CLUSTER STORES
# Ref: Knowledge_Base/DevSecOps.md & Cloud.md Phần 5 (IRSA)
# Connects External Secrets Operator to AWS Secrets Manager via ClusterSecretStore
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wave-0-external-secrets-stores
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/gryffin-uit-alpha/cluster-bootstrap.git
    targetRevision: HEAD
    path: bootstrap/wave-0-external-secrets-stores
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
