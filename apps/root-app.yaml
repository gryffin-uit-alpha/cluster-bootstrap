# ==============================================================================
# ROOT APPLICATION (App-of-Apps Pattern)
# Ref: Knowledge_Base/CI_CD.md & eks-gitops-patterns
# Sync Wave: -10 (Master orchestrator for all wave applications)
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-bootstrap-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/gryffin-uit-alpha/cluster-bootstrap.git
    targetRevision: HEAD
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
