# ==============================================================================
# SYNC WAVE 0: KYVERNO CLUSTER POLICIES
# Ref: Knowledge_Base/Security.md (Phần 5: Admission Control — Kyverno)
# Enforces non-root, resource limits, immutability across tenant namespaces
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wave-0-kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/gryffin-uit-alpha/cluster-bootstrap.git
    targetRevision: HEAD
    path: bootstrap/wave-0-policy
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
