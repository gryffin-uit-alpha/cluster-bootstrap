# ==============================================================================
# SYNC WAVE 2: APPLICATION WORKLOAD (MyBlogSpot Staging)
# Ref: Knowledge_Base/CI_CD.md & Architecture.md
# Deploys Backend, Frontend, Services, and Ingress with staging values
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wave-2-myblogspot
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/gryffin-uit-alpha/cluster-bootstrap.git
    targetRevision: HEAD
    path: helm/myblogspot
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
